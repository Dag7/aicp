[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicp"
version = "0.1.0"
description = "Python SDK for the Agentic Identity and Commerce Protocol (AICP)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "AICP Protocol Authors" }]
keywords = ["aicp", "ai-agent", "identity", "did", "verifiable-credentials", "commerce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
    "mypy>=1.15.0",
]

[project.urls]
Homepage = "https://github.com/aicp-protocol/aicp"
Repository = "https://github.com/aicp-protocol/aicp.git"
Documentation = "https://aicp.dev"

[tool.hatch.build.targets.wheel]
packages = ["src/aicp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
