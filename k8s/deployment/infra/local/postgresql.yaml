---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: aicp
  labels:
    app: postgresql
    app.kubernetes.io/part-of: aicp
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: aicp
  labels:
    app: postgresql
    app.kubernetes.io/part-of: aicp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: aicp
  labels:
    app: postgresql
    app.kubernetes.io/part-of: aicp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgresql
        app.kubernetes.io/part-of: aicp
    spec:
      containers:
        - name: postgresql
          image: postgres:17
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "aicp"
            - name: POSTGRES_PASSWORD
              value: "aicp_dev"
            - name: POSTGRES_DB
              value: "aicp"
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: postgresql-init
              mountPath: /docker-entrypoint-initdb.d
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - aicp
                - -d
                - aicp
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - aicp
                - -d
                - aicp
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - aicp
                - -d
                - aicp
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-data
        - name: postgresql-init
          configMap:
            name: postgresql-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: aicp
  labels:
    app: postgresql
    app.kubernetes.io/part-of: aicp
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: postgresql
