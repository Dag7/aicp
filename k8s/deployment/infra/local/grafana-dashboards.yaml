          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        },
        {
          "type": "panel",
          "id": "stat",
          "name": "Stat",
          "version": ""
        },
        {
          "type": "panel",
          "id": "piechart",
          "name": "Pie chart",
          "version": ""
        }
      ],
      "id": null,
      "uid": "aicp-commerce",
      "title": "AICP - Commerce",
      "description": "Payment token lifecycle, payment execution, revenue by adapter, spending limits, and receipt generation.",
      "tags": ["aicp", "commerce", "payments"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "queryValue": "",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(aicp_payment_attempts_total, namespace)",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(aicp_payment_attempts_total, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(aicp_payment_attempts_total{namespace=\"$namespace\"}, adapter)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "adapter",
            "options": [],
            "query": {
              "query": "label_values(aicp_payment_attempts_total{namespace=\"$namespace\"}, adapter)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Payment Token Issuance Rate",
          "description": "Rate of payment tokens being issued per minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "tokens/min",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_payment_tokens_issued_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Issued",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_payment_tokens_redeemed_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Redeemed",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_payment_tokens_expired_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Expired",
              "refId": "C"
            }
          ]
        },
        {
          "id": 2,
          "title": "Payment Execution Success / Failure",
          "description": "Payment execution outcomes per minute",
          "type": "timeseries",
