              "expr": "sum(rate(aicp_payment_failures_total{namespace=\"$namespace\"}[5m])) / sum(rate(aicp_payment_attempts_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "Failure Rate",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Active Payment Tokens",
          "description": "Number of currently active (unredeemed, unexpired) payment tokens",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 100 },
                  { "color": "red", "value": 500 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(aicp_payment_tokens_active{namespace=\"$namespace\"})",
              "legendFormat": "Active Tokens",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Spending Limit Violations",
          "description": "Rate of spending limit violations per minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "orange", "mode": "fixed" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "violations/min",
                "drawStyle": "bars",
                "fillOpacity": 60,
                "gradientMode": "none",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["sum", "mean", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (reason) (rate(aicp_spending_limit_violations_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "{{ reason }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Receipt Generation Rate",
          "description": "Rate of payment receipts generated per minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "receipts/min",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_receipts_generated_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Generated",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_receipts_verified_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Verified",
              "refId": "B"
            }
          ]
        }
      ]
    }
  identity-onboarding.json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "Prometheus datasource for AICP metrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "__requires": [
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        },
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        },
        {
          "type": "panel",
          "id": "stat",
          "name": "Stat",
          "version": ""
        },
        {
          "type": "panel",
          "id": "bargauge",
          "name": "Bar gauge",
          "version": ""
        }
      ],
      "id": null,
      "uid": "aicp-identity",
      "title": "AICP - Identity & Onboarding",
      "description": "DID operations, credential lifecycle, onboarding sessions, and trust scores.",
      "tags": ["aicp", "identity", "onboarding"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "queryValue": "",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(aicp_did_operations_total, namespace)",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(aicp_did_operations_total, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "DIDs Created per Minute",
          "description": "Rate of new DID document creation",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "ops/min",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_did_operations_total{namespace=\"$namespace\", operation=\"create\"}[5m])) * 60",
              "legendFormat": "Created",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "DIDs Resolved per Minute",
          "description": "Rate of DID document resolution lookups",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "ops/min",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_did_operations_total{namespace=\"$namespace\", operation=\"resolve\"}[5m])) * 60",
              "legendFormat": "Resolved",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Credential Issuance Rate",
          "description": "Verifiable credentials issued per minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "creds/min",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_credentials_issued_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Issued",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_credentials_revoked_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Revoked",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_credentials_verified_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Verified",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "title": "Active Onboarding Sessions by Phase",
          "description": "Current onboarding sessions grouped by their workflow phase",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "sessions",
                "drawStyle": "line",
                "fillOpacity": 30,
                "gradientMode": "none",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (phase) (aicp_onboarding_sessions_active{namespace=\"$namespace\"})",
              "legendFormat": "{{ phase }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Onboarding Success / Failure Rate",
          "description": "Completed onboarding sessions per minute by outcome",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "sessions/min",
                "drawStyle": "bars",
                "fillOpacity": 80,
                "gradientMode": "none",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "opm"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Failed" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Succeeded" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }
                ]
              }
            ]
          },
          "options": {
            "legend": { "calcs": ["sum", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_onboarding_completed_total{namespace=\"$namespace\", result=\"success\"}[5m])) * 60",
              "legendFormat": "Succeeded",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_onboarding_completed_total{namespace=\"$namespace\", result=\"failure\"}[5m])) * 60",
              "legendFormat": "Failed",
              "refId": "B"
            }
          ]
        },
        {
          "id": 6,
          "title": "DID-Auth Challenge Success Rate",
          "description": "DID-Auth challenge-response authentication success ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "",
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "min", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_did_auth_challenges_total{namespace=\"$namespace\", result=\"success\"}[5m])) / sum(rate(aicp_did_auth_challenges_total{namespace=\"$namespace\"}[5m]))",
              "legendFormat": "Success Rate",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Trust Score Distribution",
          "description": "Distribution of computed trust scores across agents",
          "type": "bargauge",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "continuous-GrYlRd",
                "fixedColor": "green"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.3 },
                  { "color": "yellow", "value": 0.6 },
                  { "color": "green", "value": 0.8 }
                ]
              },
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "minVizWidth": 10,
            "minVizHeight": 15,
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showUnfilled": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.25, sum by (le) (rate(aicp_trust_score_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P25",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(aicp_trust_score_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P50",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.75, sum by (le) (rate(aicp_trust_score_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P75",
              "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.90, sum by (le) (rate(aicp_trust_score_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P90",
              "refId": "D"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(aicp_trust_score_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P99",
              "refId": "E"
            }
          ]
        }
      ]
    }
