            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "payments/min",
                "drawStyle": "bars",
                "fillOpacity": 80,
                "gradientMode": "none",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "opm"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Failed" },
