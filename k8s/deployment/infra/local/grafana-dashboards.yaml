          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "$/min",
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["sum", "mean", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (adapter) (rate(aicp_payment_revenue_total{namespace=\"$namespace\", adapter=~\"$adapter\"}[5m])) * 60",
              "legendFormat": "{{ adapter }}",
              "refId": "A"
            }
          ]
