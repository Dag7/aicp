---
# Grafana dashboards ConfigMap
# Source: deploy/grafana/dashboards/*.json
# To regenerate: task grafana:configmap (or manually copy updated JSON)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: aicp
  labels:
    app.kubernetes.io/part-of: aicp
    app.kubernetes.io/component: monitoring
data:
  aicp-overview.json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "Prometheus datasource for AICP metrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "__requires": [
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        },
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        },
        {
          "type": "panel",
          "id": "stat",
          "name": "Stat",
          "version": ""
        }
      ],
      "id": null,
      "uid": "aicp-overview",
      "title": "AICP - Overview",
      "description": "High-level overview of the AICP platform including request rates, error rates, latency, and system health.",
      "tags": ["aicp", "overview"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "queryValue": "",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(aicp_http_requests_total, namespace)",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(aicp_http_requests_total, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(aicp_http_requests_total{namespace=\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "pod",
            "options": [],
            "query": {
              "query": "label_values(aicp_http_requests_total{namespace=\"$namespace\"}, pod)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate",
          "description": "Total HTTP request rate across all endpoints",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "req/s",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_http_requests_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "Total",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (method) (rate(aicp_http_requests_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "{{ method }}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate",
          "description": "HTTP 5xx error rate and error ratio",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "line" }
              },
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Error Ratio" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  { "id": "custom.axisLabel", "value": "error %" },
                  { "id": "custom.drawStyle", "value": "line" },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }
                ]
              }
            ]
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_http_requests_total{namespace=\"$namespace\", pod=~\"$pod\", status=~\"5..\"}[5m]))",
              "legendFormat": "5xx Errors",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_http_requests_total{namespace=\"$namespace\", pod=~\"$pod\", status=~\"5..\"}[5m])) / sum(rate(aicp_http_requests_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "Error Ratio",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "Request Latency (P50 / P95 / P99)",
          "description": "HTTP request duration percentiles",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "duration",
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "scheme",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(aicp_http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$pod\"}[5m])))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(aicp_http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$pod\"}[5m])))",
              "legendFormat": "P95",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(aicp_http_request_duration_seconds_bucket{namespace=\"$namespace\", pod=~\"$pod\"}[5m])))",
              "legendFormat": "P99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "title": "Active Connections",
          "description": "Current number of active HTTP connections",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 500 },
                  { "color": "red", "value": 1000 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(aicp_http_active_connections{namespace=\"$namespace\", pod=~\"$pod\"})",
              "legendFormat": "Active Connections",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Server Uptime",
          "description": "Time since the AICP server process started",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 3600 },
                  { "color": "green", "value": 86400 }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "time() - min(process_start_time_seconds{namespace=\"$namespace\", pod=~\"$pod\"})",
              "legendFormat": "Uptime",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Requests by Status Code",
          "description": "Breakdown of HTTP request rates by response status code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 12 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "req/s",
                "drawStyle": "bars",
                "fillOpacity": 80,
                "gradientMode": "none",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (status) (rate(aicp_http_requests_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m]))",
              "legendFormat": "{{ status }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "Request Rate by Endpoint",
          "description": "Top request rates broken down by handler/endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 16, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "req/s",
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(10, sum by (handler) (rate(aicp_http_requests_total{namespace=\"$namespace\", pod=~\"$pod\"}[5m])))",
              "legendFormat": "{{ handler }}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "Memory Usage",
          "description": "Process memory usage across pods",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "process_resident_memory_bytes{namespace=\"$namespace\", pod=~\"$pod\"}",
              "legendFormat": "{{ pod }}",
              "refId": "A"
            }
          ]
        }
      ]
    }
  ans-performance.json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "description": "Prometheus datasource for AICP metrics",
          "type": "datasource",
          "pluginId": "prometheus",
          "pluginName": "Prometheus"
        }
      ],
      "__requires": [
        {
          "type": "datasource",
          "id": "prometheus",
          "name": "Prometheus",
          "version": "1.0.0"
        },
        {
          "type": "grafana",
          "id": "grafana",
          "name": "Grafana",
          "version": "9.0.0"
        },
        {
          "type": "panel",
          "id": "timeseries",
          "name": "Time series",
          "version": ""
        },
        {
          "type": "panel",
          "id": "stat",
          "name": "Stat",
          "version": ""
        },
        {
          "type": "panel",
          "id": "table",
          "name": "Table",
          "version": ""
        },
        {
          "type": "panel",
          "id": "piechart",
          "name": "Pie chart",
          "version": ""
        }
      ],
      "id": null,
      "uid": "aicp-ans",
      "title": "AICP - ANS Performance",
      "description": "Agent Name Service resolution, search performance, well-known endpoints, and discovery caching.",
      "tags": ["aicp", "ans", "discovery"],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "fiscalYearStartMonth": 0,
      "liveNow": false,
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "queryValue": "",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "current": {},
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(aicp_ans_resolutions_total, namespace)",
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "name": "namespace",
            "options": [],
            "query": {
              "query": "label_values(aicp_ans_resolutions_total, namespace)",
              "refId": "StandardVariableQuery"
            },
            "refresh": 2,
            "regex": "",
            "skipUrlSync": false,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "ANS Record Resolution Rate",
          "description": "Rate of ANS name-to-record resolutions per minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "resolutions/min",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_ans_resolutions_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Total",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_ans_resolutions_total{namespace=\"$namespace\", result=\"success\"}[5m])) * 60",
              "legendFormat": "Success",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_ans_resolutions_total{namespace=\"$namespace\", result=\"not_found\"}[5m])) * 60",
              "legendFormat": "Not Found",
              "refId": "C"
            }
          ]
        },
        {
          "id": 2,
          "title": "Search Query Latency",
          "description": "ANS search query latency percentiles",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "latency",
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "scheme",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(aicp_ans_search_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(aicp_ans_search_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P95",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(aicp_ans_search_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))",
              "legendFormat": "P99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 3,
          "title": "Well-Known Endpoint Hit Rate",
          "description": "Rate of requests to /.well-known/aicp.json per minute",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "hits/min",
                "drawStyle": "line",
                "fillOpacity": 15,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(aicp_wellknown_requests_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "Total",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (status) (rate(aicp_wellknown_requests_total{namespace=\"$namespace\"}[5m])) * 60",
              "legendFormat": "{{ status }}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "title": "Cache Hit / Miss Ratio",
          "description": "ANS and discovery cache effectiveness",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "ops/min",
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "pointSize": 5,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "opm"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Hits" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Misses" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Hit Ratio" },
                "properties": [
                  { "id": "unit", "value": "percentunit" },
                  { "id": "custom.axisLabel", "value": "hit %" },
                  { "id": "custom.drawStyle", "value": "line" },
                  { "id": "custom.fillOpacity", "value": 0 },
                  { "id": "custom.lineWidth", "value": 3 },
                  { "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }
                ]
              }
            ]
          },
          "options": {
            "legend": { "calcs": ["mean", "last"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
