# This rule is not used by the project aicp-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the aicp.aicp.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: aicp-operator
    app.kubernetes.io/managed-by: kustomize
  name: aicpcluster-editor-role
rules:
- apiGroups:
  - aicp.aicp.dev
  resources:
  - aicpclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aicp.aicp.dev
  resources:
  - aicpclusters/status
  verbs:
  - get
