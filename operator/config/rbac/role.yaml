---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aicp.aicp.dev
  resources:
  - aicpclusters
  - aicpvalidators
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aicp.aicp.dev
  resources:
  - aicpclusters/finalizers
  - aicpvalidators/finalizers
  verbs:
  - update
- apiGroups:
  - aicp.aicp.dev
  resources:
  - aicpclusters/status
  - aicpvalidators/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
