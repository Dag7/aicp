apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: aicp-cluster

servers: 1 # Number of server (control-plane) nodes
agents: 0 # Number of agent (worker) nodes

# Registry configuration
registries:
  create:
    name: k3d-aicp-registry
    host: "0.0.0.0"
    hostPort: "5005"

# Port mappings for the loadbalancer node
ports:
  - port: "8081:80" # Maps host port 8081 to container port 80
    nodeFilters:
      - loadbalancer
  - port: "8443:443" # Maps host port 8443 to container port 443
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true # Wait until the cluster is ready before returning
    timeout: "120s" # Timeout for waiting
    disableLoadbalancer: false
    disableImageVolume: false
    disableRollback: false
    loadbalancer:
      configOverrides:
        - settings.workerConnections=2048
  k3s:
    extraArgs:
      - arg: "--with-node-id"
        nodeFilters:
          - server:*
          - agent:*
      # Enable aggressive image garbage collection on all nodes
      - arg: "--kubelet-arg=image-gc-high-threshold=75"
        nodeFilters:
          - server:*
          - agent:*
      - arg: "--kubelet-arg=image-gc-low-threshold=50"
        nodeFilters:
          - server:*
          - agent:*
      # Kubelet eviction thresholds
      - arg: "--kubelet-arg=eviction-hard=imagefs.available<10%,nodefs.available<10%"
        nodeFilters:
          - server:*
          - agent:*
      # Kubelet log rotation
      - arg: "--kubelet-arg=container-log-max-size=20Mi"
        nodeFilters:
          - server:*
          - agent:*
      - arg: "--kubelet-arg=container-log-max-files=3"
        nodeFilters:
          - server:*
          - agent:*
    nodeLabels:
      - label: cluster=aicp-cluster
        nodeFilters:
          - agent:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
