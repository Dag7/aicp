{{- if .Values.validator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aicp.fullname" . }}-validator-headless
  labels:
    {{- include "aicp.validatorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: grpc
      port: {{ .Values.ledger.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.server.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "aicp.validatorSelectorLabels" . | nindent 4 }}
{{- end }}
