{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aicp.fullname" . }}
  labels:
    {{- include "aicp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aicp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic on the server port
    - ports:
        - protocol: TCP
          port: {{ .Values.server.port | default 8080 }}
    # Allow metrics scraping on the metrics port
    - ports:
        - protocol: TCP
          port: {{ .Values.server.metricsPort | default 9090 }}
    # Allow validator gRPC communication between validators
    - from:
        - podSelector:
            matchLabels:
              {{- include "aicp.validatorSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ledger.grpcPort | default 9091 }}
  egress:
    # Allow DNS resolution (UDP and TCP)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to PostgreSQL
    - ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Redis
    - ports:
        - protocol: TCP
          port: 6379
    # Allow validator gRPC communication between validators
    - to:
        - podSelector:
            matchLabels:
              {{- include "aicp.validatorSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ledger.grpcPort | default 9091 }}
{{- end }}
