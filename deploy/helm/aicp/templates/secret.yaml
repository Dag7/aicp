{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aicp.fullname" . }}-secret
  labels:
    {{- include "aicp.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_PASSWORD: {{ .Values.postgresql.auth.password | b64enc | quote }}
  DATABASE_USER: {{ .Values.postgresql.auth.username | b64enc | quote }}
  DATABASE_NAME: {{ .Values.postgresql.auth.database | b64enc | quote }}
  DATABASE_URL: {{ include "aicp.databaseUrl" . | b64enc | quote }}
  {{- if .Values.redis.externalUrl }}
  REDIS_URL: {{ .Values.redis.externalUrl | b64enc | quote }}
  {{- else }}
  REDIS_URL: {{ include "aicp.redisUrl" . | b64enc | quote }}
  {{- end }}
  {{- if .Values.commerce.stripe.secretKey }}
  STRIPE_SECRET_KEY: {{ .Values.commerce.stripe.secretKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.commerce.stripe.webhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.commerce.stripe.webhookSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.commerce.paypal.clientId }}
  PAYPAL_CLIENT_ID: {{ .Values.commerce.paypal.clientId | b64enc | quote }}
  {{- end }}
  {{- if .Values.commerce.paypal.clientSecret }}
  PAYPAL_CLIENT_SECRET: {{ .Values.commerce.paypal.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if .Values.commerce.usdc.apiKey }}
  USDC_API_KEY: {{ .Values.commerce.usdc.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
