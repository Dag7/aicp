version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "../internal/ledger/migrations/"
    gen:
      go:
        package: "dbgen"
        out: "generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "text[]"
            go_type: "[]string"
